<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Memories</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="page">

        <div class="card">

            <div class="siblings">
                👦🏻🤝👧🏻
            </div>

            <h1>Our Memory Box</h1>

            <p>
                Click next and see our little memories.
            </p>


            <div class="memory-box">

                <img id="memoryPhoto"
                   src="images/photo1.jpg"
                   alt="Me and my brother">

               


                <p id="memoryText">

                    One of our beautiful memories.

                </p>

            </div>


            <div class="memory-buttons">

                <button onclick="previousPhoto()">
                    ← Back
                </button>

                <button onclick="nextPhoto()">
                    Next →
                </button>

            </div>


            <button onclick="location.href='gifts.html'">

                Continue the Surprise 🎁

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
