<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Things I Want to Say</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="page">

        <div class="card">

            <div class="siblings">
                👦🏻🤝👧🏻
            </div>

            <h1>Three Things I Want to Say</h1>

            <p>
                Pick any one.
            </p>


            <div class="feeling-buttons">

                <button onclick="showFeeling('like')">

                    One Thing I Like About You

                </button>


                <button onclick="showFeeling('funny')">

                    One Funny Truth 😂

                </button>


                <button onclick="showFeeling('real')">

                    Something I Really Feel

                </button>

            </div>


            <div id="feelingMessage"
                 class="message-popup">

                Your message will appear here.

            </div>


            <button onclick="location.href='surprise.html'">

                Final Surprise ✨

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
